[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon"
version = "0.1.0"
description = "AI Finance Controller: three-way settlement reconciliation with typed variance decomposition"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The vendor SDK is OPTIONAL on purpose. CLAUDE.md pins the default install to
# pydantic + pytest to protect the clean-clone gate, and the adjudicator imports
# it lazily -- with the extra absent the run degrades to rules-only, which is the
# path every run takes today.
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
